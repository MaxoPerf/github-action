# Scenario: secrets stay in GitHub. A `kind: secret` file declares `valueFrom: { env: CHECKOUT_API_TOKEN }`; the step
# passes the GitHub secret as that environment variable. The value is never in git, the ledger or an export.
name: perf-secrets-from-github
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: MaxoPerf/github-action@v1
        with:
          api-key: ${{ secrets.MAXOPERF_API_KEY }}
          account-id: ${{ vars.MAXOPERF_ACCOUNT_ID }}
          command: apply
        env:
          CHECKOUT_API_TOKEN: ${{ secrets.CHECKOUT_API_TOKEN }}
