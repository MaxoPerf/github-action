# Scenario: custom wait limit. timeout-minutes is the max wait per run (default 60); it should exceed the test's
# duration plus provisioning time. Also set the job-level timeout-minutes a little higher as a backstop.
name: perf-custom-timeout
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  load-test:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
      - uses: MaxoPerf/github-action@v1
        with:
          api-key: ${{ secrets.MAXOPERF_API_KEY }}
          account-id: ${{ vars.MAXOPERF_ACCOUNT_ID }}
          project-id: ${{ vars.MAXOPERF_PROJECT_ID }}
          timeout-minutes: '120'
