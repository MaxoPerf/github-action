# Scenario: the same tests against several environments, each with its own TARGET_URL.
# Push once first, then fan out with `needs: push`: concurrent first-time pushes can create duplicate tests.
name: perf-matrix
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: MaxoPerf/github-action@v1
        with:
          api-key: ${{ secrets.MAXOPERF_API_KEY }}
          account-id: ${{ vars.MAXOPERF_ACCOUNT_ID }}
          project-id: ${{ vars.MAXOPERF_PROJECT_ID }}
          command: push
  run:
    needs: push
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: staging
            target_url: https://staging.example.com
          - environment: production
            target_url: https://www.example.com
    steps:
      - uses: actions/checkout@v4
      - uses: MaxoPerf/github-action@v1
        with:
          api-key: ${{ secrets.MAXOPERF_API_KEY }}
          account-id: ${{ vars.MAXOPERF_ACCOUNT_ID }}
          project-id: ${{ vars.MAXOPERF_PROJECT_ID }}
          config-overrides: TARGET_URL=${{ matrix.target_url }}
