# yaml-language-server: $schema=https://maxoperf.com/schemas/resources/v1/test.json
# Config and secret bindings by URI, with an aliased environment variable name (`envName`). The legacy form
# (`config: [TARGET_URL]`, see k6-config-secrets.yml) still works.
version: 1
kind: test
key: test-secrets-config
name: "Example test with config and secrets"
engineKind: k6
entrypoint: examples/tests/scripts/secured.js
loadProfile: { virtualUsers: 25, agentCount: 1, rampUpSeconds: 5, durationSeconds: 30, maxVirtualUsersPerRunner: 25 }
locationPlan: { rows: [{ kind: managed, cloudProvider: aws, region: us-east-1, runnerCount: 1, weight: 1 }] }
config:
  - maxoperf://config/target-url
secrets:
  - { secret: "maxoperf://secret/checkout-api-token", envName: SECRET_API_TOKEN }
tags: [example, secrets]
