# Config and secret bindings by key. Both must already exist in the workspace; the sync fails loudly if one is missing.
# Git is the source of truth: bindings are replaced with exactly the keys listed here.
version: 1
name: "Example k6 with config and secrets"
engineKind: k6
entrypoint: examples/tests/scripts/secured.js
loadProfile: { virtualUsers: 25, agentCount: 1, rampUpSeconds: 5, durationSeconds: 30, maxVirtualUsersPerRunner: 25 }
locationPlan: { rows: [{ kind: managed, cloudProvider: aws, region: us-east-1, runnerCount: 1, weight: 1 }] }
tags: ["example", "secrets"]
config: ["TARGET_URL"]
secrets: ["CHECKOUT_API_TOKEN"]   # never pass tokens through config-overrides
