# yaml-language-server: $schema=https://maxoperf.com/schemas/resources/v1/alert-rule.json
# Copy to .maxoperf/alert-rules/<slug>.yml. A rule never names a test: it watches `scopeKind: all` or the tests that
# carry one of `tagFilter` (`scopeKind: tags`). `destinationIds` are notification integrations.
version: 1
kind: alert-rule
key: checkout-p95
name: Checkout p95
workspace: Payments
metric: p95_latency_ms
operator: above
threshold: 800
durationMinutes: 5
severity: critical
scopeKind: tags
tagFilter: [checkout]
destinationIds: [maxoperf://notification-integration/slack-perf]
