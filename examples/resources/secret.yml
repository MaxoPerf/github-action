# yaml-language-server: $schema=https://maxoperf.com/schemas/resources/v1/secret.json
# Copy to .maxoperf/secrets/<slug>.yml. The value is never in git: it is read from the CI environment variable named
# in `valueFrom.env` at apply time (give the step `env: { CHECKOUT_API_TOKEN: ${{ secrets.CHECKOUT_API_TOKEN }} }`).
version: 1
kind: secret
key: checkout-api-token
name: CHECKOUT_API_TOKEN
workspace: Payments
valueFrom: { env: CHECKOUT_API_TOKEN }
